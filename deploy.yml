# .github/workflows/deploy.yml
#
# Publica automaticamente o site do Cetec Linhares na Hostinger
# toda vez que houver um push na branch principal (main).
#
# CONFIGURACAO NECESSARIA (uma vez só, no GitHub):
# 1. No repositorio, va em: Settings -> Secrets and variables -> Actions
# 2. Clique em "New repository secret" e crie estes 4 secrets:
#      FTP_HOST      = 62.72.62.196
#      FTP_USER      = u635298688
#      FTP_PASS      = Ou532030@@
#      FTP_REMOTE_DIR = /domains/ceteclinhares.com.br/public_html
#
# Depois disso, basta dar "git push" que o deploy acontece sozinho.
 
name: Deploy Cetec para Hostinger
 
on:
  push:
    branches:
      - main
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4
 
      - name: Publicar via FTP na Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          port: 21
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
 
